version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm@9.15.0
        - pnpm install --frozen-lockfile
    build:
      commands:
        - export NODE_ENV=production
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
      - .pnpm-store/**/* 